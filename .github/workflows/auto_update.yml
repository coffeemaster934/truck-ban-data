name: Daily Truck Bans Check

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch: 

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run update script
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python update_bans.py

      - name: Commit and push if changed
        run: |
          git config --global user.name 'GitHub Actions Bot'
          git config --global user.email 'actions@github.com'
          
          # Nejdříve ze všeho natvrdo stáhneme aktuální stav, ať se s ničím netrápíme
          git fetch origin main
          git reset --hard origin/main
          
          # Znovu spustíme python skript, aby vygeneroval čerstvá data nad aktuálním stavem
          python update_bans.py
          
          git add bans.json
          git diff --quiet && git diff --staged --quiet && exit 0
          
          git commit -m "Automatická aktualizace změn v datech [skip ci]"
          git push origin main
